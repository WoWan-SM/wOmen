plugins {
	id 'java'
	id 'application'
}

group = 'com.l2walker.oog'
version = '0.1.0-SNAPSHOT'
description = 'Minimal open-source OOG client scaffold for Lineage 2 Gracia Epilogue (protocol 152)'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

application {
	mainClass = 'com.l2walker.oog.Main'
}

tasks.named('test') {
	useJUnitPlatform()
}

jar {
	manifest {
		attributes(
			'Main-Class': 'com.l2walker.oog.Main',
			'Implementation-Title': project.name,
			'Implementation-Version': project.version
		)
	}
}
